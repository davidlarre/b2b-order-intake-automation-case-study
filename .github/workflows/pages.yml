name: Publicar la página del caso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    # GitHub Pages necesita el repositorio público: mientras sea privado, el trabajo se omite en lugar de fallar.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # En un trabajo aparte: si publica justo después de subir, GitHub a veces todavía no lista el paquete.
  publicar:
    needs: preparar
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
